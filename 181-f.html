		<script>
(function(){
  const SPLIT_MAP = {"classes.js":["https://cdn.jsdelivr.net/gh/swaftmc/games@main/162/classes.js.part00","https://cdn.jsdelivr.net/gh/swaftmc/games@main/162/classes.js.part01"]};
  if (!SPLIT_MAP || Object.keys(SPLIT_MAP).length === 0) return;
  const partCache = {};
  async function fetchMerged(partUrls) {
    const key = partUrls.join("|");
    if (partCache[key]) return partCache[key];
    const bufs = await Promise.all(partUrls.map(async (u) => {
      const r = await fetch(u);
      if (!r.ok) throw new Error("part fetch failed: " + u + " (" + r.status + ")");
      return new Uint8Array(await r.arrayBuffer());
    }));
    const total = bufs.reduce((a, b) => a + b.length, 0);
    const merged = new Uint8Array(total);
    let off = 0;
    for (const b of bufs) { merged.set(b, off); off += b.length; }
    const blobUrl = URL.createObjectURL(new Blob([merged]));
    partCache[key] = blobUrl;
    return blobUrl;
  }
  (async () => {
    try {
      const entries = Object.entries(SPLIT_MAP);
      for (const [name, partUrls] of entries) {
        SPLIT_MAP[name] = await fetchMerged(partUrls);
      }
    } catch (e) {
      console.error("SPLIT_MAP premerge failed:", e);
      return;
    }
    const origFetch = window.fetch;
    window.fetch = async function(resource, options) {
      if (typeof resource === "string") {
        const key = decodeURIComponent(resource.split("/").pop().split("?")[0]);
        if (SPLIT_MAP[key]) return origFetch(SPLIT_MAP[key], options);
      }
      return origFetch(resource, options);
    };
    const OrigXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
      const xhr = new OrigXHR();
      const origOpen = xhr.open;
      xhr.open = function(method, url, ...rest) {
        if (typeof url === "string") {
          const key = decodeURIComponent(url.split("/").pop().split("?")[0]);
          if (SPLIT_MAP[key]) url = SPLIT_MAP[key];
        }
        return origOpen.call(xhr, method, url, ...rest);
      };
      return xhr;
    };
  })();
})();
</script>

		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					
				}
			});
